name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate release configuration
        id: release
        env:
          RELEASE_GATEWAY_URL: ${{ vars.RELEASE_GATEWAY_URL }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 ../../scripts/release-preflight.py
      - name: Prepare Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 ../../scripts/prepare-google-services.py
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          umask 077
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Record signing certificate digest
        id: signing
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          DIGEST=$(keytool -J-Duser.language=en -J-Duser.country=US -list -v -keystore "$RUNNER_TEMP/release.jks" -alias "$RELEASE_KEY_ALIAS" -storepass:env RELEASE_STORE_PASSWORD | awk '/SHA256:/ { print tolower($2) }' | tr -d ':')
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid signing certificate digest" >&2; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256 digest: $DIGEST"
          echo "### Signing Certificate SHA-256 Digest" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Build signed release APK
        env:
          RELEASE_GATEWAY_URL: ${{ steps.release.outputs.gateway }}
          RELEASE_VERSION_NAME: ${{ steps.release.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release.outputs.code }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease --console=plain
          -Pfingerpost.gatewayUrl="${RELEASE_GATEWAY_URL}"
          -Pfingerpost.versionName="${RELEASE_VERSION_NAME}"
          -Pfingerpost.versionCode="${RELEASE_VERSION_CODE}"
      - name: Verify APK signature
        env:
          RELEASE_CERTIFICATE_SHA256: ${{ steps.signing.outputs.digest }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          python3 ../../scripts/verify-release-apk.py \
            --apksigner "$APKSIGNER" \
            --apk app/build/outputs/apk/release/app-release.apk \
            --expected-certificate-sha256 "$RELEASE_CERTIFICATE_SHA256"
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_NAME="fingerpost-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          gh release create "${TAG}" "${APK_NAME}" "${APK_NAME}.sha256" --title "${TAG}" --generate-notes
      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json


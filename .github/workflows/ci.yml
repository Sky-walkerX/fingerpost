name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # reads packageManager (pnpm@11.10.0) from package.json
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @fingerpost/web build
      - run: node scripts/check-built-web.mjs
      - run: pnpm check:day2
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # The promo beat/tone tools (scripts/promo_*.py) use numpy; pinned to the locally verified version.
      - run: python3 -m pip install numpy==2.5.3
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  android:
    runs-on: ubuntu-latest      # has the Android SDK preinstalled
    defaults: { run: { working-directory: apps/android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare optional Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 ../../scripts/prepare-google-services.py
      - run: ./gradlew :core:guidance:test :core:protocol:test --console=plain
      - run: ./gradlew :app:test :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
